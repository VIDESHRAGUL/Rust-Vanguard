[package]
name = "rust-vanguard-core"
version = "0.1.0"
edition = "2021"
authors = ["Frey"]
description = "Anti-cheat core for Rust-Vanguard"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
opt-level = 3
lto = true

